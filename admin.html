<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temple Admin</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--red:#78150e;--orange:#e96720;--cream:#fff8ee;--line:#eadbca}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:"Noto Sans Devanagari",sans-serif;color:#2c211d}header{background:linear-gradient(135deg,#65100a,#d34c18);color:white;padding:25px}main{width:min(1050px,92%);margin:28px auto}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 12px 35px #5b2b1b12}h1,h2{margin-top:0;color:var(--red)}header h1{color:white}input,textarea,select{width:100%;padding:11px;border:1px solid #d7c5b4;border-radius:9px;font:inherit;margin:5px 0 13px}textarea{min-height:160px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.btn{border:0;border-radius:9px;background:var(--orange);color:white;padding:11px 16px;font-weight:800;cursor:pointer;text-decoration:none}.secondary{background:#eee0d3;color:var(--red)}.hide{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px;cursor:pointer}.active{background:#fff0da}.item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.muted{color:#75665e;font-size:13px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><header><main style="margin:0 auto"><h1>🪔 मंदिर Admin Panel</h1><div>काली माता करौली धाम • साइट सामग्री प्रबंधन</div></main></header><main><div id="login" class="panel"><h2>Admin Login</h2><p class="muted">Supabase Auth में अधिकृत खाते से लॉगिन करें।</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><span id="msg"></span></div><div id="app" class="hide"><div class="panel"><button class="btn secondary" onclick="logout()">Logout</button> <a class="btn" href="index.html">साइट देखें</a></div><div class="tabs"><button class="tab active" onclick="showTab('content',this)">📜 पाठ</button><button class="tab" onclick="showTab('events',this)">📅 कार्यक्रम</button><button class="tab" onclick="showTab('notice',this)">📢 सूचना</button><button class="tab" onclick="showTab('gallery',this)">🖼️ फोटो</button><button class="tab" onclick="showTab('settings',this)">⚙️ जानकारी</button></div><section id="content" class="panel"><h2>पाठ / आरती / चालीसा</h2><div class="row"><div><input id="ctitle" placeholder="शीर्षक"><select id="ccat"><option>आरती</option><option>चालीसा</option><option>पाठ</option><option>मंत्र</option><option>अन्य</option></select><input id="cdesc" placeholder="छोटा विवरण"></div><textarea id="ctext" placeholder="पूरा पाठ"></textarea></div><button class="btn" onclick="saveContent()">सहेजें</button><div id="clist"></div></section><section id="events" class="panel hide"><h2>कार्यक्रम</h2><div class="row"><div><input id="etitle" placeholder="कार्यक्रम का नाम"><input id="edate" type="date"></div><textarea id="edesc" placeholder="विवरण"></textarea></div><button class="btn" onclick="saveEvent()">सहेजें</button><div id="elist"></div></section><section id="notice" class="panel hide"><h2>मुख्य सूचना</h2><input id="ntitle" placeholder="शीर्षक"><textarea id="nbody" placeholder="सूचना"></textarea><button class="btn" onclick="saveNotice()">प्रकाशित करें</button></section><section id="gallery" class="panel hide"><h2>फोटो अपलोड</h2><p class="muted">Supabase Storage → temple-media bucket</p><input id="gtitle" placeholder="फोटो का नाम"><input id="gfile" type="file" accept="image/*"><button class="btn" onclick="uploadGallery()">Upload</button><div id="glist"></div></section><section id="settings" class="panel hide"><h2>मंदिर जानकारी</h2><input id="stiming" placeholder="दर्शन / आरती समय"><input id="saddress" placeholder="पता / Maps"><input id="scontact" placeholder="संपर्क"><input id="shero" placeholder="Hero image public URL"><button class="btn" onclick="saveSettings()">अपडेट करें</button></section></div></main><script>
var URL="https://bxtceoypagkvyuhstgkj.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4dGNlb3lwYWdrdnl1aHN0Z2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk1OTU3MzAsImV4cCI6MjA3NTE3MTczMH0.ORaooeDLhXBV0yFwaIhmG38r81sWRuXMZSaxKoYHLZA",sb=supabase.createClient(URL,KEY);
function showTab(id,b){document.querySelectorAll("#app section").forEach(function(x){x.classList.add("hide")});document.getElementById(id).classList.remove("hide");document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active")});b.classList.add("active")}
async function login(){var r=await sb.auth.signInWithPassword({email:email.value,password:password.value});msg.textContent=r.error?" — "+r.error.message:"";check()}
async function logout(){await sb.auth.signOut();check()}async function check(){var r=await sb.auth.getSession(),ok=!!r.data.session;login.classList.toggle("hide",ok);app.classList.toggle("hide",!ok);if(ok)refresh()}
async function saveContent(){var r=await sb.from("content_items").insert({title:ctitle.value,category:ccat.value,description:cdesc.value,text:ctext.value,published:true});alert(r.error?r.error.message:"सहेजा गया");refresh()}
async function saveEvent(){var r=await sb.from("events").insert({title:etitle.value,date:edate.value,description:edesc.value,published:true});alert(r.error?r.error.message:"सहेजा गया");refresh()}
async function saveNotice(){var r=await sb.from("announcements").insert({title:ntitle.value,body:nbody.value,published:true});alert(r.error?r.error.message:"प्रकाशित");refresh()}
async function uploadGallery(){var f=gfile.files[0];if(!f)return alert("फोटो चुनें");var path="gallery/"+Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9._-]/g,"-");var r=await sb.storage.from("temple-media").upload(path,f,{contentType:f.type});if(r.error)return alert(r.error.message);var u=sb.storage.from("temple-media").getPublicUrl(path).data.publicUrl;r=await sb.from("gallery").insert({title:gtitle.value||f.name,path:path,public_url:u,published:true});alert(r.error?r.error.message:"फोटो अपलोड हो गई");refresh()}
async function saveSettings(){var rows=[["timing",stiming.value],["address",saddress.value],["contact",scontact.value],["hero_image",shero.value]];for(var i=0;i<rows.length;i++)if(rows[i][1])await sb.from("site_settings").upsert({key:rows[i][0],value:rows[i][1]});alert("जानकारी अपडेट हुई")}
async function refresh(){var r=await sb.from("content_items").select("id,title,category").order("created_at",{ascending:false});clist.innerHTML=(r.data||[]).map(function(x){return '<div class="item"><span>'+x.title+'</span><span>'+x.category+'</span></div>'}).join("");r=await sb.from("events").select("title,date").order("date",{ascending:false});elist.innerHTML=(r.data||[]).map(function(x){return '<div class="item"><span>'+x.title+'</span><span>'+x.date+'</span></div>'}).join("");r=await sb.from("gallery").select("title,public_url").order("created_at",{ascending:false});glist.innerHTML=(r.data||[]).map(function(x){return '<div class="item"><span>'+x.title+'</span><a href="'+x.public_url+'" target="_blank">देखें</a></div>'}).join("")}
check();
</script></body></html>
